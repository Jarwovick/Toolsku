name: Build Toolsku APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Unduh gradle-wrapper.jar secara otomatis jika belum ada di repositori
    - name: Setup Gradle Wrapper JAR
      run: |
        mkdir -p gradle/wrapper
        curl -sJLO https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
        mv gradle-wrapper.jar gradle/wrapper/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Toolsku-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
